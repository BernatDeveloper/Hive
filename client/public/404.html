<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#3B82F6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página no encontrada · Hive</title>
    <style>
      /* Autocontenida: este fichero lo sirve el alojamiento con estado 404 real
         para rutas/ficheros que no existen, sin pasar por la app (ni cargarla). */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 2rem 1.25rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
        background: #F5F5F7;
        color: #1D1D1F;
        -webkit-font-smoothing: antialiased;
      }
      .code {
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.06em;
        color: #3B82F6;
        opacity: 0.9;
      }
      h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
      p { max-width: 360px; color: #6E6E73; line-height: 1.55; }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.7rem 1.4rem;
        border-radius: 12px;
        background: #3B82F6;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { opacity: 0.9; }
      a:focus-visible { outline: 2px solid #3B82F6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <p class="code" aria-hidden="true">404</p>
    <h1>No encontramos esta página</h1>
    <p>La dirección que has abierto no existe o ha cambiado.</p>
    <a href="/">Ir al inicio</a>
  </body>
</html>
